name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python-lint:
    name: Python lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install ruff
        run: uv tool install ruff
      - name: ruff check
        run: ruff check infra airflow
      - name: ruff format --check
        run: ruff format --check infra airflow

  sql-lint:
    name: SQL lint (sqlfluff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install sqlfluff
        run: pip install "sqlfluff==3.2.5"
      - name: sqlfluff lint snowflake/
        run: sqlfluff lint snowflake/

  dbt-parse:
    name: dbt parse
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbt/jaffle_shop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dbt-snowflake
        run: pip install "dbt-snowflake==1.8.4"
      - name: Write throwaway CI profile (no connection used by `dbt parse`)
        run: |
          mkdir -p ci
          cat > ci/profiles.yml <<'YAML'
          jaffle_shop:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: ci-placeholder
                user: ci
                password: ci
                role: DBT_ROLE
                warehouse: DBT_WH
                database: GOLD
                schema: MARTS
                threads: 1
          YAML
      - name: dbt deps
        run: dbt deps
      - name: dbt parse
        run: dbt parse --profiles-dir ci
