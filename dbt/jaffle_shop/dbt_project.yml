name: 'jaffle_shop'

config-version: 2
version: '0.1'

profile: 'jaffle_shop'

model-paths: ["models"]
test-paths: ["tests"]
analysis-paths: ["analysis"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
    - "target"
    - "dbt_modules"
    - "logs"

require-dbt-version: [">=1.0.0", "<2.0.0"]

# Medallion routing. DBT_ROLE is read-write on BRONZE, SILVER and GOLD:
#   staging/* -> SILVER.STAGING  (incremental SCD-1, pre-hook COPY from S3)
#   marts/*   -> GOLD.MARTS      (curated tables + semantic views)
# Raw tables in BRONZE.RAW are created by schemachange (V1.1.11) and loaded
# by COPY commands running as dbt pre-hooks on each staging model.
# See macros/get_custom_names.sql, which makes +database / +schema literal.
models:
  jaffle_shop:
      +materialized: table
      +database: GOLD
      +schema: MARTS
      staging:
        +materialized: incremental
        +database: SILVER
        +schema: STAGING
      marts:
        +materialized: table
        +database: GOLD
        +schema: MARTS
      semantic_models:
        +materialized: table
        +database: GOLD
        +schema: MARTS
