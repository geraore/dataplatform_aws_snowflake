version: 2

models:
  - name: dim_date
    description: Calendar date dimension covering 2017-01-01 through 2026-12-31, generated via Snowflake GENERATOR. Join to fact_orders on order_date = date_day.

    columns:
      - name: date_day
        description: Primary key — the calendar date.
        tests:
          - unique
          - not_null

      - name: year
        description: Calendar year (e.g. 2018).

      - name: quarter
        description: Calendar quarter (1–4).

      - name: month
        description: Calendar month number (1–12).

      - name: month_name
        description: Abbreviated month name (e.g. Jan, Feb).

      - name: week_of_year
        description: ISO week number within the year (1–53).

      - name: day_of_month
        description: Day number within the month (1–31).

      - name: day_of_week
        description: Day of week number — 0 = Sunday, 6 = Saturday (Snowflake convention).

      - name: day_name
        description: Abbreviated day name (e.g. Mon, Tue).

      - name: is_weekend
        description: True if the date falls on a Saturday or Sunday.
