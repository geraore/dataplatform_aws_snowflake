version: 2

models:
  - name: fact_orders
    description: One row per order with per-payment-method breakdowns.

    columns:
      - name: order_id
        description: Primary key.
        tests:
          - unique
          - not_null

      - name: customer_id
        description: Foreign key to dim_customers.
        tests:
          - not_null

      - name: store_id
        description: Foreign key to dim_stores.
        tests:
          - not_null

      - name: order_date
        description: Date (UTC) the order was placed.

      - name: status
        description: '{{ doc("orders_status") }}'
        tests:
          - accepted_values:
              values: ['placed', 'shipped', 'completed', 'return_pending', 'returned']

      - name: amount
        description: Total payment amount (AUD) for the order.

      - name: credit_card_amount
        description: Portion of the order paid by credit card (AUD).

      - name: coupon_amount
        description: Portion of the order paid by coupon (AUD).

      - name: bank_transfer_amount
        description: Portion of the order paid by bank transfer (AUD).

      - name: gift_card_amount
        description: Portion of the order paid by gift card (AUD).
