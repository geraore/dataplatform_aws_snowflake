version: 2

models:
  - name: sv_dim_products
    description: >
      Secured view over dim_products. Row access filtered by entitlements
      (resource = 'product'). price masked unless access_level >= 2.
    config:
      row_access_policy: 'GOVERNANCE.SECURITY.RAP_PRODUCT on (product_id)'
      post_hook:
        - "{{ apply_column_masking(this, model) }}"
    columns:
      - name: product_id
        description: Primary key.
      - name: name
        description: Product display name.
      - name: category
        description: Product category.
      - name: price
        data_type: number
        description: "Financial. Unit price (AUD). Visible at access_level >= 2, else NULL."
        config:
          meta:
            security:
              resource: product
