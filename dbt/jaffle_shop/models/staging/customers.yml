version: 2

models:
  - name: customers
    columns:
      - name: customer_id
        data_type: integer
        tests:
          - unique
          - not_null
      - name: first_name
        data_type: varchar
        tests:
          - not_null
      - name: last_name
        data_type: varchar
        tests:
          - not_null
      - name: ce_time
        data_type: timestamp_tz
        tests:
          - not_null
