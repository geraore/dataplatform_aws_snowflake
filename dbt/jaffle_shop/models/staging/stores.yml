version: 2

models:
  - name: stores
    columns:
      - name: store_id
        tests:
          - unique
          - not_null
      - name: name
        tests:
          - not_null
      - name: city
        tests:
          - not_null
      - name: state
        tests:
          - not_null
      - name: country
        tests:
          - not_null
