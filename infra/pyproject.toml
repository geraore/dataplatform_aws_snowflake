[project]
name = "dataplatform-infra"
version = "0.1.0"
description = "CDK app for the AWS + Snowflake data platform demo"
requires-python = ">=3.11"
dependencies = [
    "aws-cdk-lib>=2.150.0,<3.0.0",
    "constructs>=10.0.0,<11.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "boto3>=1.34.0",      # for type hints / local lambda iteration
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["stacks", "lambdas"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.uv]
package = false
