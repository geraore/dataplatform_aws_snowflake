event_type: com.dataplatform.ecommerce.payment.processed
source: //dataplatform/payment-service

data:
  payment_id:
    type: sequence
    start: 1
  order_id:
    type: reference
    from: order_id
    min: 1
    max: 1000
  payment_method:
    type: choice
    values: [credit_card, coupon, bank_transfer, gift_card]
  amount:
    type: float
    min: 5.00
    max: 200.00
    decimals: 2
