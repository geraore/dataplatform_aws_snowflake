event_type: com.dataplatform.ecommerce.store.upsert
source: //dataplatform/catalog

data:
  store_id:
    type: int
    min: 1
    max: 20
  name:
    type: faker
    method: company
  city:
    type: faker
    method: city
  state:
    type: choice
    values: [NSW, VIC, QLD, WA, SA, ACT, TAS, NT]
  country:
    type: choice
    values: [Australia]
